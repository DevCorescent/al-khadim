version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alkhadim_db
    environment:
      POSTGRES_DB: alkhadim_db
      POSTGRES_USER: alkhadim_user
      POSTGRES_PASSWORD: alkhadim_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alkhadim_user -d alkhadim_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: alkhadim_api
    environment:
      DATABASE_URL: postgresql://alkhadim_user:alkhadim_pass@postgres:5432/alkhadim_db
      JWT_SECRET: change-this-in-production
      JWT_REFRESH_SECRET: change-this-refresh-in-production
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  web:
    build: ./web
    container_name: alkhadim_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
